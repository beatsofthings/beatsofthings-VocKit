name: VocKit DSP checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with warnings
        run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tests/vocoder_smoke.cpp -o /tmp/vockit-test
      - name: Run DSP smoke tests
        run: /tmp/vockit-test
      - name: Compile filterbank diagnostics
        run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tests/filterbank_diagnostics.cpp -o /tmp/vockit-filter-test
      - name: Run filterbank diagnostics
        run: /tmp/vockit-filter-test
      - name: Compile synthetic vowel spectra test
        run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tests/vowel_spectra.cpp -o /tmp/vockit-vowels
      - name: Verify five vowel formant spectra
        run: /tmp/vockit-vowels
      - name: Compile and test post-vocoder FX
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tests/postfx_smoke.cpp -o /tmp/vockit-postfx
          /tmp/vockit-postfx
      - name: Verify real FFT spectrum telemetry
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tests/spectrum_smoke.cpp -o /tmp/vockit-spectrum
          /tmp/vockit-spectrum
      - name: Long-run DSP stability and throughput (CI machine, not MPC CPU)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tests/long_run.cpp -o /tmp/vockit-longrun
          /tmp/vockit-longrun
      - name: Verify non-persistent 24-bin spectrum snapshot
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tests/snapshot_smoke.cpp -o /tmp/vockit-snapshot
          /tmp/vockit-snapshot
