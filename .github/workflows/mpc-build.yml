name: Build and test VocKit for MPC
on:
  workflow_dispatch:
  push:
    paths:
      - 'mpc/**'
      - 'src/**'
      - '.github/workflows/mpc-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get official SDK
        run: git clone --depth 1 https://github.com/inmusic-software/mpc-plugin-builder-sdk.git sdk
      - name: Install toolchain
        run: python -m pip install ziglang Pillow
      - name: Install VocKit source into SDK
        run: |
          mkdir -p sdk/plugins/VocKit/src
          cp mpc/plugin.json mpc/ui.json mpc/README.md sdk/plugins/VocKit/
          cp mpc/src/VocKit.cpp src/Vocoder.hpp src/SpectralVocoder.hpp sdk/plugins/VocKit/src/
          # Safety rollback: the custom TUI produced a blank MPC screen.
          # Keep custom skin sources in Git, but use the proven ui.json generator.
      - name: Patch SDK UI generator (vertical bands + English help)
        run: python mpc/patch_generated_ui.py sdk/tools/gen_ui.py
      - name: Build ARM and native
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python sdk/tools/build.py sdk/plugins/VocKit --target all
      - name: Render parameter-linked filter and envelope graphics
        run: |
          set -euo pipefail
          SKIN=$(find sdk/plugins/VocKit/build -type f -name TUI.json -printf '%h\n' | grep 'Plugin Skins' | head -n 1)
          test -n "$SKIN"
          python mpc/generate_graphics.py "$SKIN"
          for file in filter_response.png synth_envelope.png; do test -s "$SKIN/$file"; done
      - name: Validate
        run: python sdk/tools/validate.py sdk/plugins/VocKit
      - name: Verify visible vertical bands and English help in generated TUI
        run: |
          python - <<'PY'
          import json, pathlib
          files=list(pathlib.Path("sdk/plugins/VocKit/build").rglob("TUI.json"))
          assert files, "TUI.json missing"
          t=next((json.loads(p.read_text()) for p in files if "Plugin Skins" in str(p)), None)
          assert t, "Packaged TUI missing"
          tabs={x["tabName"]:x for x in t["pageData"]["tabs"]}
          assert "HELP" in tabs and "BAND1" in tabs and "BAND2" in tabs
          voice=tabs["VOICE"]["componentDefinition"]["componentsData"]
          assert any("Audio Monitor" in str(item) for item in voice), "Audio Monitor missing from VOICE UI"
          params=json.loads(pathlib.Path("sdk/plugins/VocKit/build/params.json").read_text())
          assert "Audio Monitor" in str(params), "Audio Monitor parameter missing from binary"
          for name in ("BAND1","BAND2"):
              controls=tabs[name]["componentDefinition"]["componentsData"]
              assert sum(x["componentData"]["type"]=="vockitVerticalBand" for x in controls)==12, name
          qfiles=list(pathlib.Path("sdk/plugins/VocKit/build").rglob("Q-Links.json"))
          q=json.loads(next(p for p in qfiles if "Plugin Skins" in str(p)).read_text())
          for page,first in (("BAND1",19),("BAND2",31)):
              tab_index=next(i for i,t in enumerate(t["pageData"]["tabs"],1) if t["tabName"]==page)
              mapping=next(m["Q-Links"] for m in q["Screen Mode Q-Links"]["map"] if m["Tab"]==tab_index)
              assert [mapping["Q-Link "+str(i)] for i in range(1,13)]==list(range(first,first+12)), page
          help_controls=tabs["HELP"]["componentDefinition"]["componentsData"]
          texts=[x["componentData"]["data"].get("text","") for x in help_controls]
          assert len(texts)>=13 and any("mpctoolkit.com" in x for x in texts), texts
          filter_controls=tabs["FILTER"]["componentDefinition"]["componentsData"]
          graphs=[x for x in filter_controls if x["componentData"]["type"]=="Image" and x["componentData"]["data"].get("imageType")=="Regular"]
          assert len(graphs)==2, "Expected one combined filter and one envelope diagram"
          for graph in graphs:
              image=graph["componentData"]["data"]["image"]
              assert (files[0].parent / image).exists(), image
          print("Custom band layouts, HELP text and four parameter-linked diagrams present")
          PY
      - name: Run host simulator
        run: |
          set -euo pipefail
          SIM=sdk/.sdk-tools/host_sim
          NATIVE=$(find sdk/plugins/VocKit/build/native -maxdepth 1 -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) | head -n 1)
          test -n "$NATIVE"
          "$SIM" "$NATIVE" test --seconds 3 --wav sdk/plugins/VocKit/build/test.wav
      - name: Prepare installable plugin archive
        run: |
          set -euo pipefail
          mkdir -p dist
          find sdk/plugins/VocKit/build -name 'version.xml' -print
          PLUGIN=$(find sdk/plugins/VocKit/build -type f -name version.xml -printf '%h\n' | head -n 1)
          test -n "$PLUGIN"
          test -f "$PLUGIN/plugin.json"
          test -d "$PLUGIN/VST"
          test -d "$PLUGIN/Plugin Skins"
          test -f "$PLUGIN/Plugin Skins/TUI.json"
          test -f "$PLUGIN/Plugin Skins/Q-Links.json"
          # Verify that generated skin files are included in the install archive.
          (cd "$(dirname "$PLUGIN")" && zip -qr "$GITHUB_WORKSPACE/dist/VocKit-MPC-install.zip" "$(basename "$PLUGIN")")
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VocKit-MPC-install
          path: dist/VocKit-MPC-install.zip
