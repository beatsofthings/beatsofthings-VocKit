name: Build VocKit Synth
on:
  push:
    paths:
      - 'mpc-synth/**'
      - 'src/**'
      - '.github/workflows/synth-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official SDK
        run: git clone --depth 1 https://github.com/inmusic-software/mpc-plugin-builder-sdk.git sdk
      - name: Install Zig
        run: python -m pip install ziglang
      - name: Stage Synth plugin
        run: |
          mkdir -p sdk/plugins/VocKitSynth/src
          cp mpc-synth/plugin.json mpc-synth/ui.json mpc-synth/README.md sdk/plugins/VocKitSynth/
          cp mpc-synth/src/VocKitSynth.cpp src/Vocoder.hpp sdk/plugins/VocKitSynth/src/
          if test -d mpc-synth/Content; then cp -r mpc-synth/Content sdk/plugins/VocKitSynth/; fi
      - name: Build and validate
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python sdk/tools/build.py sdk/plugins/VocKitSynth --target all
          python sdk/tools/validate.py sdk/plugins/VocKitSynth
      - name: Simulator test
        run: |
          set -euo pipefail
          NATIVE=$(find sdk/plugins/VocKitSynth/build/native -maxdepth 1 -type f \( -name '*.so' -o -name '*.dylib' \) | head -n 1)
          test -n "$NATIVE"
          sdk/.sdk-tools/host_sim "$NATIVE" test --notes 48,52,55 --seconds 3 --wav sdk/plugins/VocKitSynth/build/test.wav
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          PLUGIN=$(find sdk/plugins/VocKitSynth/build -type f -name version.xml -printf '%h\n' | head -n 1)
          test -n "$PLUGIN"
          (cd "$(dirname "$PLUGIN")" && zip -qr "$GITHUB_WORKSPACE/dist/VocKit-Synth-install.zip" "$(basename "$PLUGIN")")
      - uses: actions/upload-artifact@v4
        with:
          name: VocKit-Synth-install
          path: dist/VocKit-Synth-install.zip
